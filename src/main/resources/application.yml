spring:
  application:
    name: dev-ai-assistant
  thymeleaf:
    cache: false

server:
  port: 8080

app:
  name: Development AI Assistant
  ai:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
